<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>데일리보카 보드</title>
<meta name="theme-color" content="#4a0f1f">
<link rel="manifest" href="teacher.webmanifest">
<link rel="icon" href="teacher-icon-192.png">
<link rel="apple-touch-icon" href="teacher-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보카 보드">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f7f3f2;--card:#fff;--ink:#2a1418;--sub:#7a6669;--line:#ece3e1;--navy:#4a0f1f;--blue:#8c1c34;--glow:rgba(214,88,112,.5);
  --B:#4c5fd5;--H:#e0517a;--M:#7b4fd8;--good:#1f8a70;--mid:#e09a1a;--bad:#d6453d;
  --shadow:0 1px 2px rgba(20,26,58,.05),0 8px 24px rgba(20,26,58,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.hero{background:var(--navy);color:#fff;border-radius:28px;padding:26px 26px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;bottom:-120px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none}
.hero .warn{font-size:13px;color:#b9bedc}
.hero h1{margin:6px 0 2px;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;font-weight:900}
.hero .meta{color:#c4c8e4;font-size:14px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.hb{border:0;border-radius:14px;padding:11px 16px;font-weight:800;background:#fff;color:var(--navy);display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px}
.hb.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.tabs{display:flex;gap:8px;margin-top:18px;position:relative;z-index:1}
.tab{border:0;border-radius:999px;padding:10px 20px;font-weight:800;background:rgba(255,255,255,.12);color:#dfe2f5;font-size:16px}
.tab.on{background:#fff;color:var(--navy)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px}
.lv{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.lvbadge{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;color:#fff;font-weight:900;font-size:20px}
.lv h2{margin:10px 0 0;font-size:24px;letter-spacing:-.02em}
.lv .s{color:var(--sub);font-size:14px}
.qr{border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;background:#fff;cursor:zoom-in;flex:none}
.qr .box{width:132px;height:132px;display:grid;place-items:center}
.qr .box svg{width:100%;height:100%}
.qr small{display:block;color:var(--sub);font-size:12px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 16px;font-weight:800;font-size:15px;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#fff}
.url{display:block;margin-top:10px;color:var(--sub);font-size:13px;word-break:break-all}
.dayl{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.dayl input{width:76px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.msg{margin-top:18px}
.card[style*="--c"]{border-top:6px solid var(--c)}
.lsum{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.lst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.lst b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em}
.lst span{font-size:11px;color:var(--sub);font-weight:700}
.ltop{margin-top:12px;font-size:12px;color:var(--sub);font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ltop span{background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:800}
.ltop i{font-style:normal;color:var(--bad);margin-left:2px}
.nbox{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;background:var(--bg);border-radius:14px;padding:10px 6px;margin:0 0 12px}
.nbox b{display:block;font-size:20px;font-weight:900}
.nbox span{font-size:11px;color:var(--sub);font-weight:700}
.lnote{margin-top:12px;font-size:13px;color:var(--sub);font-weight:700}
.lnote b{color:var(--ink);font-size:15px}
.lgo{margin-top:12px;width:100%;border:0;border-radius:14px;padding:11px;font-weight:800;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.msg textarea{width:100%;min-height:120px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical}

/* 현황판 */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800}
.chip.on{background:var(--c,var(--navy));border-color:var(--c,var(--navy));color:#fff}
.chips .sp{flex:1}
.search{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:999px;min-width:180px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.tile{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px 18px}
.tile b{display:block;font-size:30px;letter-spacing:-.03em;font-weight:900}
.tile span{color:var(--sub);font-size:13px;font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card h3{margin:0 0 12px;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--sub);font-size:12px;font-weight:800;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.st{cursor:pointer}
tr.st:hover td{background:var(--bg)}
.nm{font-weight:800;white-space:nowrap}
@media (max-width:600px){.hide-s{display:none}.chip .lt{display:none}.search{flex:1 1 0;min-width:0;width:0}.chips .sp{display:none}td,th{padding:9px 4px}.hero{padding:22px 20px 18px}}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:4px;vertical-align:middle}
.tag.old{background:#fdeceb;color:var(--bad)}
.tag.blk{background:#eee;color:#666}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;border-radius:99px}
.pc{font-size:12px;color:var(--sub);white-space:nowrap}
.sc{font-weight:800}
.g{color:var(--good)}.m{color:var(--mid)}.r{color:var(--bad)}
.tw{display:flex;flex-direction:column;gap:6px}
.twr{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.twr .k{color:var(--sub);font-weight:800;font-size:13px}
.twr .w{font-weight:800}
.twr .w small{font-weight:500;color:var(--sub);margin-left:6px}
.twr .n{font-weight:900;font-size:13px;border-radius:999px;padding:2px 9px;background:#fdeceb;color:var(--bad)}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.note{color:var(--sub);font-size:13px;margin-top:10px}

/* 학생 상세 */
.ov{position:fixed;inset:0;background:rgba(10,14,35,.45);z-index:50;display:flex;justify-content:flex-end}
.dr{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);padding:18px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drh{display:flex;align-items:center;gap:10px}
.drh h2{margin:0;flex:1;font-size:26px}
.x{border:0;background:#fff;border-radius:12px;width:40px;height:40px;font-size:20px;box-shadow:var(--shadow)}
.kv{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:14px;margin:6px 0 14px}
.kv b{color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dd{aspect-ratio:1;border-radius:7px;background:#e9ebf2;font-size:10px;display:grid;place-items:center;color:#9aa0b8;font-weight:700}
.dd.g{background:var(--good);color:#fff}.dd.m{background:var(--mid);color:#fff}.dd.r{background:var(--bad);color:#fff}
.dd.p{background:#fff;border:2px dashed var(--c);color:var(--c)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.zoom{position:fixed;inset:0;background:rgba(10,14,35,.7);z-index:60;display:grid;place-items:center;padding:20px}
.zoom .zc{background:#fff;border-radius:24px;padding:24px;text-align:center;max-width:420px;width:100%}
.zoom .zc svg{width:100%;height:auto}
.zoom h3{margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.keybox{max-width:420px;margin:60px auto;text-align:center}
.keybox input{font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;width:100%;margin:12px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.psheet{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;padding:16px}
.psheet .pbar{display:flex;gap:8px;align-items:center;max-width:1000px;margin:0 auto 12px;height:auto;background:none;overflow:visible}
.psheet .pbar .sp{flex:1}
.ppage{max-width:1000px;margin:0 auto;background:#fff;border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.ptitle{font-size:30px;font-weight:900;letter-spacing:-.02em;text-align:center}
.psub{text-align:center;color:var(--sub);margin:6px 0 22px;font-size:16px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:700px){.pgrid{grid-template-columns:1fr}}
.pq{border:3px solid var(--c);border-radius:22px;padding:16px;text-align:center}
.pq svg{width:100%;height:auto;display:block}
.pqh{font-size:20px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.pqh span{background:var(--c);color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.pqs{margin:-6px 0 10px;color:var(--sub);font-weight:700;font-size:14px}
.pqu{font-size:11px;color:var(--sub);margin-top:8px;word-break:break-all}
.pfoot{text-align:center;color:var(--sub);font-size:14px;margin-top:20px}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body.printing>*:not(.psheet),.no-print{display:none!important}
  html,body.printing{background:#fff!important;height:auto}
  body.printing{background:#fff}
  .psheet{position:static;padding:0;background:#fff}
  .ppage{box-shadow:none;border-radius:0;padding:0;max-width:none}
  .pgrid{grid-template-columns:repeat(3,1fr)!important}
  .pq{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="warn">선생님용 · 학생에게 이 주소는 주지 마세요</div>
    <h1>데일리보카 보드</h1>
    <div class="meta" id="meta">단계 3개 · 학생 링크 · QR · 학생 현황판</div>
    <div class="hbtns">
      <button class="hb" id="reload">↻ 새로고침</button>
      <a class="hb ghost" id="sheet" target="_blank" rel="noopener" style="display:none">구글 시트 열기 ↗</a>
      <button class="hb ghost" id="install" style="display:none">⊕ 앱으로 설치</button>
    </div>
    <div class="tabs">
      <button class="tab" data-tab="links">단계별 한눈에</button>
      <button class="tab" data-tab="dash">학생 현황판</button>
    </div>
  </section>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function () {
  /* ---------- 설정 ---------- */
  var BUILD = '20261111-1400';
  var API = 'https://script.google.com/macros/s/AKfycbxFdWbjp32WVN9Q8FfHIdXYSagbePYxfbFWombtbAB4DkHT27asKAj7_1Y6lgB9iUcJ/exec';
  var PIN = '6900';
  var BASE = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
  var LEVELS = [
    { id: 'M', title: '데일리보카 M', sub: '중등 (Middle School)', file: 'm.html', days: 80, color: '#7b4fd8' },

    { id: 'H', title: '데일리보카 H', sub: '고등 (High School)', file: 'h.html', days: 112, color: '#e0517a' }
  ];
  var LV = {}; LEVELS.forEach(function (l) { LV[l.id] = l; });
  /* 단계별 학생 링크 QR (보드 안에 저장 — 인터넷이 막혀도 보임) */
  var QRS = {"B": "29:8tq64f,4jcif5,6gmvrx,6gca59,6h4pct,4ij48x,8tz2pr,focg,5w9iqa,8sf7m1,4dn7uf,5kfgw2,8tgu6j,bycax,3gu80b,7ivcmi,5cepkb,1tggr1,4y90kz,2stg0a,4thkog,y61j,8tlbob,4iwly0,6h6l83,6gqto7,6hbxdl,4ifseq,8uaiab", "H": "33:3x2w1of,20cnpz5,2vg54d9,2vg94d9,2vfcaql,20mkx1d,3xbl6yn,2owlc,2bo195s,2a774kj,2tyvq5x,1hp1cbc,lntmfe,2jlbywr,3tf3r9u,2b83u5u,35321jm,1b7nlii,2mydkw7,247jbj5,27cudfm,1azztxn,34kuku5,1up2uqg,2n2zx0w,axli3,3wz1vmm,20gkzkh,2vgqnlk,2vizo0i,2ve7or5,207joug,3x8ezve", "M": "33:3xf6min,20mrjup,2vekevx,2vqjrrx,2vefhb1,2078rwh,3xbl6yn,frbb4,2tqvxvv,3cous8d,3xcybp7,dgk5pl,20rqpbv,3cx22h6,1ss2nw,1962198,qjhwbg,1kg1yaj,29zg2uu,rijvio,gw3vv0,2ai7ef9,ykhqb7,18kobqh,2rosctt,dp9ga,3xc1gsw,20kz76n,2vbb8qe,2voew4j,2vkf6n4,20cw73t,3xamw7o"};
  function staticQr(id) {
    var v = QRS[id]; if (!v) return '';
    var n = +v.split(':')[0], rows = v.split(':')[1].split(','), p = '';
    rows.forEach(function (r, y) { var b = parseInt(r, 36).toString(2); while (b.length < n) b = '0' + b;
      for (var x = 0; x < n; x++) if (b[x] === '1') p += 'M' + x + ' ' + y + 'h1v1h-1z'; });
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#fff"/><path d="' + p + '" fill="#000"/></svg>';
  }

  /* ---------- 공통 ---------- */
  var $main = document.getElementById('main');
  function E(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 1800); }
  function copy(t, done) {
    var ok = function () { toast(done || '복사했어요'); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
    function fallback() { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { prompt('복사해 주세요', t); } a.remove(); }
  }
  function link(l, day) { return BASE + l.file + (day ? '?day=' + day : ''); }
  var KST = 9 * 3600e3;
  function dkey(t) { return new Date(t + KST).toISOString().slice(0, 10); }
  function ago(t) {
    if (!t) return '—';
    var d = Math.floor((Date.parse(dkey(Date.now())) - Date.parse(dkey(t))) / 864e5);
    if (d <= 0) { var dt = new Date(t + KST); return '오늘 ' + dt.getUTCHours() + ':' + ('0' + dt.getUTCMinutes()).slice(-2); }
    if (d === 1) return '어제';
    return d + '일 전';
  }
  function daysAgo(t) { return t ? Math.floor((Date.parse(dkey(Date.now())) - Date.parse(dkey(t))) / 864e5) : 999; }
  function pct(s) { var m = /^(\d+)\s*\/\s*(\d+)$/.exec(String(s)); return m && +m[2] ? Math.round(100 * m[1] / m[2]) : null; }
  function cls(p) { return p == null ? '' : p >= 90 ? 'g' : p >= 70 ? 'm' : 'r'; }
  function qrSvg(text, cell) {
    for (var i = 0; i < LEVELS.length; i++) if (link(LEVELS[i]) === text) return staticQr(LEVELS[i].id);
    if (!window.qrcode) return '<span style="font-size:12px;color:#999">QR 불러오는 중</span>';
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: cell || 4, margin: 0, scalable: true });
  }

  /* ---------- 탭 ---------- */
  var tab = ls('vb_tab2') || 'links';
  document.querySelectorAll('.tab').forEach(function (b) {
    b.onclick = function () { tab = b.dataset.tab; ls('vb_tab2', tab); render(); scrollTo(0, 0); };
  });

  /* ---------- 앱 설치 ---------- */
  var deferred = null, $inst = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; $inst.style.display = ''; });
  $inst.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; $inst.style.display = 'none'; }); };
  var standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    $inst.style.display = ''; $inst.onclick = function () { alert('Safari 아래쪽 공유 버튼(□↑) → "홈 화면에 추가"를 누르면 앱처럼 설치돼요.'); };
  }

  /* ---------- 열쇠 ---------- */
  var m = /[#&]k=([^&]+)/.exec(location.hash);
  if (m) { ls('vb_key', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
  function key() { return ls('vb_key') || ''; }

  /* ---------- 데이터 ---------- */
  var DATA = null, loading = false, err = '';
  try { DATA = JSON.parse(ls('vb_cache') || 'null'); } catch (e) {}
  function load() {
    if (!key()) { render(); return; }
    loading = true; err = ''; render();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ act: 'board', key: key(), pin: PIN }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        loading = false;
        if (!j || !j.ok) { err = (j && j.err === 'key') ? 'key' : 'server'; if (err === 'key') ls('vb_key', null); render(); return; }

  /* ---------- 계산 ---------- */
  var F = { lv: ls('vb_lv') || 'ALL', q: '', sort: 'last', dir: -1 };
  function build() {
    var S = {};
    (DATA.students || []).forEach(function (s) { S[s.name] = { name: s.name, code: s.code, first: s.first, last: s.last, blocked: s.blocked, lv: {}, wrong: [] }; });
    function get(n) { return S[n] || (S[n] = { name: n, code: '', first: 0, last: 0, blocked: false, lv: {}, wrong: [] }); }
    (DATA.hw || []).forEach(function (h) {
      var s = get(h.name), L = s.lv[h.level] || (s.lv[h.level] = { days: {}, done: 0, sum: 0, n: 0, lastT: 0 });
      var p = pct(h.score);
      L.days[h.day] = { score: h.score, p: p, t: h.t };
      if (p != null) { L.done++; L.sum += p; L.n++; }
      if (h.t > L.lastT) L.lastT = h.t;
      if (h.t > s.last) s.last = h.t;
    });
    (DATA.wrong || []).forEach(function (w) { var s = get(w.name); s.wrong.push(w); if (w.t > s.last) s.last = w.t; });
    (DATA.notes || []).forEach(function (n) { var s = get(n.name); s.nt = s.nt || {}; s.nt[n.level] = n; if (n.last > s.last) s.last = n.last; });
    return Object.keys(S).map(function (k) { return S[k]; });
  }
  function inLv(s) {
    if (F.lv === 'ALL') return true;
    return !!s.lv[F.lv];
  }
  function stat(s) {
    var ids = F.lv === 'ALL' ? LEVELS.map(function (l) { return l.id; }).filter(function (id) { return s.lv[id]; }) : [F.lv];
    var done = 0, sum = 0, n = 0, total = 0;
    ids.forEach(function (id) { var L = s.lv[id]; if (!L) return; done += L.done; sum += L.sum; n += L.n; total += (LV[id] ? LV[id].days : 0); });
    var wr = s.wrong.filter(function (w) { return F.lv === 'ALL' || w.level === F.lv; }).length;
    var nl = null, g7 = 0, nlast = 0;
    Object.keys(s.nt || {}).forEach(function (id) { if (F.lv !== 'ALL' && id !== F.lv) return; var n = s.nt[id]; nl = (nl || 0) + n.left; g7 += n.g7; if (n.last > nlast) nlast = n.last; });
    return { nl: nl, g7: g7, nlast: nlast, done: done, total: total || (F.lv !== 'ALL' && LV[F.lv] ? LV[F.lv].days : 0), avg: n ? Math.round(sum / n) : null, wrong: wr, ids: ids };
  }

      var l = LV[id] || { title: id, days: 80, color: '#888' }, L = s.lv[id];
      h += '<div class="card" style="margin-top:12px;--c:' + l.color + '"><h3><span class="lvbadge" style="background:' + l.color + ';width:28px;height:28px;font-size:14px;border-radius:9px;vertical-align:-6px">' + id + '</span> ' + E(l.title) +
        ' <span class="pc">완료 ' + L.done + ' / ' + l.days + ' · 평균 ' + (L.n ? Math.round(L.sum / L.n) + '%' : '—') + '</span></h3>' +
        (s.nt && s.nt[id] ? '<div class="nbox"><div><b class="' + (s.nt[id].left >= 15 && !s.nt[id].g7 ? 'r' : '') + '">' + s.nt[id].left + '</b><span>오답노트 남음</span></div><div><b class="g">' + s.nt[id].grad + '</b><span>졸업(누적)</span></div><div><b>' + s.nt[id].g7 + '</b><span>최근 7일 졸업</span></div><div><b>' + s.nt[id].star + '</b><span>별표</span></div><div><b style="font-size:14px">' + ago(s.nt[id].last) + '</b><span>최근 복습</span></div></div>' : '') +
        '<div class="days">';
      for (var d = 1; d <= l.days; d++) {
        var x = L.days[d];
        h += x ? (x.p == null ? '<div class="dd p" title="' + d + '일 진행중">' + d + '</div>' : '<div class="dd ' + cls(x.p) + '" title="' + d + '일 ' + E(x.score) + '">' + d + '</div>') : '<div class="dd">' + d + '</div>';
      }
      h += '</div><div class="legend"><span><i style="background:var(--good)"></i>90% 이상</span><span><i style="background:var(--mid)"></i>70~89%</span><span><i style="background:var(--bad)"></i>70% 미만</span><span><i style="border:2px dashed ' + l.color + ';background:#fff"></i>진행중</span></div></div>';
    });
    var W = {};
    s.wrong.forEach(function (w) { var k = w.level + '|' + w.w, o = W[k] || (W[k] = { w: w.w, m: w.m, lv: w.level, n: 0, t: 0 }); o.n++; if (w.t > o.t) o.t = w.t; });
    var wl = Object.keys(W).map(function (k) { return W[k]; }).sort(function (a, b) { return b.n - a.n || b.t - a.t; });
    h += '<div class="card" style="margin-top:12px"><h3>틀린 단어 ' + wl.length + '개</h3>';
    if (!wl.length) h += '<div class="empty">아직 오답이 없어요.</div>';
    else h += '<div class="tw">' + wl.slice(0, 100).map(function (t, i) {
      return '<div class="twr"><span class="k">' + (i + 1) + '</span><span class="w">' + E(t.w) + '<small>' + E(t.m) + '</small> <span class="tag" style="background:' + (LV[t.lv] ? LV[t.lv].color : '#999') + ';color:#fff">' + E(t.lv) + '</span></span><span class="n">' + t.n + '회</span></div>';
    }).join('') + '</div><div class="row"><button class="btn" id="cpw">이 학생 오답 복사</button></div>';
    h += '</div></div>';
    ov.innerHTML = h; document.body.appendChild(ov);
    ov.onclick = function (e) { if (e.target === ov) ov.remove(); };
    ov.querySelector('#cl').onclick = function () { ov.remove(); };
    var cw = ov.querySelector('#cpw');
    if (cw) cw.onclick = function () { copy(s.name + ' 오답 단어\n' + wl.map(function (t) { return t.w + '\t' + t.m + '\t' + t.n + '회'; }).join('\n'), '오답 단어를 복사했어요'); };
  }

  render();
  if (key()) load();

  /* 새 버전 자동 확인: GitHub에 새 teacher.html을 올리면 열 때 저절로 바뀜 */
  function checkUpdate() {
    fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = /var BUILD = '([^']+)'/.exec(t);
      if (!m || m[1] === BUILD) return;
      var tried = ''; try { tried = sessionStorage.getItem('vb_upd') || ''; } catch (e) {}
      if (tried === m[1]) return;
      try { sessionStorage.setItem('vb_upd', m[1]); } catch (e) {}
      location.replace(location.pathname + '?v=' + m[1]);
    }, function () {});
  }
  checkUpdate();
  
  document.addEventListener('visibilitychange', function () { if (document.hidden) return; checkUpdate(); if (key() && DATA && Date.now() - DATA.at > 60000) load(); });
})();
</script>
</body>
</html>
